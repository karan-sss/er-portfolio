server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Caddy (edge) adds HSTS and the other security headers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
}
